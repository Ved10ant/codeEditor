name: CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ved10ant
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: true
          tags: |
            ved10ant/codeeditor-frontend:latest
            ved10ant/codeeditor-frontend:${{ github.sha }}

  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ved10ant
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: true
          tags: |
            ved10ant/codeeditor-backend:latest
            ved10ant/codeeditor-backend:${{ github.sha }}

  validate:
    needs: [frontend , backend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Docker Build Validation
        run: |
          # Start containers using the prod profile defined in your docker-compose.yml
          docker compose --profile prod up -d --build
          
          # Wait 15 seconds for services to be ready (especially MongoDB and Node)
          sleep 15
          
          # Print out running containers for debugging in GitHub Actions logs
          docker ps
          
          # Check health of the backend (using the /health route from server.js)
          curl -f http://localhost:4000/health || exit 1
          
          # Tear down the test environment
          docker compose --profile prod down